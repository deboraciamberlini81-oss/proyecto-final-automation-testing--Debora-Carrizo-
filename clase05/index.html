<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="calculadora" id="calculadora">

        <h1 id="titulo-calculadora">Calculadora</h1>

        <section class="operaciones" id="operaciones">

            <div class="campo">
                <label for="numero1">Primer número</label>
                <input
                    type="number"
                    id="numero1"
                    name="numero1"
                    class="campo-numero"
                >
            </div>

            <div class="campo">
                <label for="numero2">Segundo número</label>
                <input
                    type="number"
                    id="numero2"
                    name="numero2"
                    class="campo-numero"
                >
            </div>

            <div class="botones-operaciones" id="botones-operaciones">

                <button
                    type="button"
                    id="btn-sumar"
                    name="sumar"
                    class="btn-operacion"
                >
                    Sumar
                </button>

                <button
                    type="button"
                    id="btn-restar"
                    name="restar"
                    class="btn-operacion"
                >
                    Restar
                </button>

                <button
                    type="button"
                    id="btn-multiplicar"
                    name="multiplicar"
                    class="btn-operacion"
                >
                    Multiplicar
                </button>

                <button
                    type="button"
                    id="btn-dividir"
                    name="dividir"
                    class="btn-operacion"
                >
                    Dividir
                </button>

            </div>

            <div class="resultado" id="resultado">
                <label for="resultado-valor">Resultado</label>

                <output
                    id="resultado-valor"
                    name="resultado"
                    class="resultado-valor"
                >
                    0
                </output>
            </div>

        </section>

    </main>

</body>
</html>
