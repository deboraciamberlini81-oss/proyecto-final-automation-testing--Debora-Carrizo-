
[pytest]
addopts = -v -ra --html=reports/report.html --self-contained-html

testpaths =
    tests
    tests_behave

python_files = test_*.py
python_functions = test_*

pythonpath = .

markers =
    smoke: pruebas criticas de verificacion rapida
    api: pruebas de API
    ui: pruebas de interfaz
    e2e: pruebas end-to-end del ciclo completo
    regression: pruebas de regresion funcional
    bdd: pruebas basadas en comportamiento
    behave: integracion de Behave con Pytest

